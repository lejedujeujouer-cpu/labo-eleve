<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Aire et périmètre d'un disque</title>
  <!-- Styles et aides communs à tous les outils (fournis par l'application) -->
  <link rel="stylesheet" href="../../commun/outil.css">
  <script src="../../commun/outil.js"></script>
</head>
<body>
  <div class="outil">
    <!-- Panneau de gauche : explications et réglages -->
    <aside class="panneau">
      <div>
        <h1>Aire et périmètre d'un disque</h1>
        <p class="note">Fais varier le rayon <i>r</i> du disque.</p>
      </div>
      <section class="groupe">
        <h2>Réglage</h2>
        <div class="curseur">
          <label for="rayon">Rayon r</label><output for="rayon"></output>
          <input id="rayon" type="range" min="0.5" max="5" step="0.1" value="2">
        </div>
      </section>
      <section class="groupe">
        <h2>Résultats</h2>
        <div class="stats">
          <div class="stat"><div class="nom">Périmètre 2πr</div><div class="val" id="perimetre"></div></div>
          <div class="stat"><div class="nom">Aire πr²</div><div class="val" id="aire"></div></div>
        </div>
      </section>
    </aside>

    <!-- Zone de droite : le dessin -->
    <main class="scene"><canvas id="cv"></canvas></main>
  </div>

  <script>
    let r = 2;

    // Outil.canvas gère la netteté, le redimensionnement et le thème clair/sombre.
    const scene = Outil.canvas(document.getElementById('cv'), (ctx, L, H) => {
      const echelle = Math.min(L, H) / 12;          // pixels par unité
      const cx = L / 2, cy = H / 2;
      ctx.fillStyle = Outil.css('--c5') + '33';
      ctx.strokeStyle = Outil.css('--c5');
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, r * echelle, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      Outil.fleche(ctx, cx, cy, cx + r * echelle, cy, Outil.css('--texte'));
      ctx.fillStyle = Outil.css('--texte');
      ctx.font = Outil.police(16, 600);
      ctx.textAlign = 'center';
      ctx.fillText('r = ' + Outil.nombre(r, 1), cx + (r * echelle) / 2, cy - 12);
    });

    // Outil.curseur relie le curseur à son affichage et appelle la fonction à chaque changement.
    Outil.curseur('rayon', (v) => {
      r = v;
      document.getElementById('perimetre').textContent = Outil.nombre(2 * Math.PI * r, 2);
      document.getElementById('aire').textContent = Outil.nombre(Math.PI * r * r, 2);
      scene.redessiner();
    });
  </script>
</body>
</html>
