<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>GeoGebra Classique</title>
  <!-- Page de Labo Élève : elle démarre le moteur web de GeoGebra installé sur l'ordinateur de l'élève
       (servi depuis son dossier d'installation, rien n'est copié ni distribué avec Labo Élève). -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #ggw { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="ggw" class="geogebraweb"
       data-param-appName="classic" data-param-app="true" data-param-fittoscreen="true"
       data-param-language="fr" data-param-showAppsPicker="false"
       data-param-showMenuBar="true" data-param-showToolBar="true" data-param-showAlgebraInput="true"
       data-param-enableShiftDragZoom="true" data-param-enableRightClick="true"
       data-param-useBrowserForJS="false" data-param-showLogging="false"></div>
  <script src="web3d/web3d.nocache.js"></script>
</body>
</html>
