<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tableau périodique</title>
  <link rel="stylesheet" href="../../commun/outil.css">
  <script src="../../commun/outil.js"></script>
  <style>
    .outil { grid-template-columns: 340px 1fr; }
    .scene { overflow: auto; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; }
    .conteneur { container-type: inline-size; width: 100%; max-width: 1280px; margin: 0 auto; }
    .tableau { display: grid; grid-template-columns: repeat(18, 1fr); gap: 0.35cqw; }
    .tableau { grid-template-rows: auto auto; row-gap: 0.35cqw; }
    .el {
      --cat: #888; --c-a: #0f766e; --c-z: #a21caf; position: relative; aspect-ratio: 1 / 1.5; border-radius: 0.5cqw; border: 1px solid color-mix(in srgb, var(--cat) 55%, transparent);
      background: color-mix(in srgb, var(--cat) 18%, var(--surface)); padding: 0.3cqw 0.35cqw; cursor: pointer;
      display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto 1fr auto auto; column-gap: 0.2cqw;
      transition: transform .12s, box-shadow .12s, opacity .2s, filter .2s; color: var(--texte); font: inherit; overflow: hidden; text-align: center;
    }
    .el:hover, .el:focus-visible { transform: scale(1.15); z-index: 3; box-shadow: 0 8px 22px rgba(0,0,0,.25); outline: none; }
    .el.choisi { box-shadow: 0 0 0 0.25cqw var(--texte); z-index: 2; }
    .el .a, .ex-case .a { grid-column: 1; grid-row: 1; font-size: 1cqw; color: var(--c-a); line-height: 1.1; text-align: left; }
    .el .z, .ex-case .z { grid-column: 1; grid-row: 2; font-size: 1cqw; color: var(--c-z); line-height: 1.1; text-align: left; }
    .el .sym, .ex-case .sym { grid-column: 2; grid-row: 1 / 3; font-size: 2.05cqw; letter-spacing: -0.03em; font-weight: 750; line-height: 1; align-self: center; }
    .el .nom-el { grid-column: 1 / -1; grid-row: 4; font-size: 0.82cqw; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .el .m, .ex-case .m { grid-column: 1 / -1; grid-row: 5; font-size: 1.05cqw; color: var(--c-z); line-height: 1.15; }
    .el.courant::after { content: "★"; position: absolute; bottom: 0.2cqw; right: 0.3cqw; font-size: 0.75cqw; color: var(--texte-doux); }
    .legende button.courants::before { content: "★"; background: none; width: auto; height: auto; color: var(--texte-doux); }
    .el.estompe { opacity: .18; filter: saturate(.3); }
    .el.dans-formule { box-shadow: 0 0 0 0.25cqw var(--c4); }
    .entete-groupe { font-size: 1.05cqw; text-align: center; color: #b45309; align-self: end; }
    .explication { display: flex; align-items: center; justify-content: center; gap: 0.8cqw; font-size: 1.05cqw; pointer-events: none; }
    .ex-gauche, .ex-droite { display: flex; flex-direction: column; gap: 2.2cqw; }
    .ex-gauche { text-align: right; } .ex-a { color: #0f766e; } .ex-z { color: #a21caf; } .ex-m { color: #a21caf; }
    .ex-gauche span::after { content: " ⟶"; } .ex-droite span::before { content: "⟵ "; }
    .ex-case { --c-a: #0f766e; --c-z: #a21caf; width: 5.4cqw; aspect-ratio: 1 / 1.5; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto 1fr auto; padding: 0.4cqw;
      background: color-mix(in srgb, #eab308 30%, var(--surface)); border: 1px solid #ca8a04; border-radius: 0.5cqw; text-align: center; }
    .ex-case .m { grid-row: 4; }

    .legende { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .legende button { --cat: #888; border: 1px solid var(--bord); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
    .legende button::before { content: ""; width: 11px; height: 11px; border-radius: 3px; background: var(--cat); }
    .legende button.actif { border-color: var(--cat); background: color-mix(in srgb, var(--cat) 15%, var(--surface)); }

    .fiche { border-radius: 16px; padding: 16px; background: color-mix(in srgb, var(--cat, var(--accent)) 14%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--cat, var(--accent)) 40%, var(--bord)); display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
    .fiche .grand { --c-a: #0f766e; --c-z: #a21caf; width: 110px; height: 150px; border-radius: 12px; background: color-mix(in srgb, var(--cat) 14%, var(--surface)); border: 3px solid var(--cat);
      display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto 1fr auto auto; padding: 8px 10px; text-align: center; }
    .fiche .grand .a { grid-column: 1; grid-row: 1; font-size: 17px; font-weight: 700; color: var(--c-a); text-align: left; }
    .fiche .grand .z { grid-column: 1; grid-row: 2; font-size: 17px; font-weight: 700; color: var(--c-z); text-align: left; }
    .fiche .grand .sym { grid-column: 2; grid-row: 1 / 3; font-size: 42px; font-weight: 800; line-height: 1; align-self: center; }
    .fiche .grand .nom-el { grid-column: 1 / -1; grid-row: 4; font-size: 13px; }
    .fiche .grand .m { grid-column: 1 / -1; grid-row: 5; font-size: 16px; font-weight: 600; color: var(--c-z); }
    .fiche .titre-el { font-size: 20px; font-weight: 700; }
    .fiche .cat { font-size: 13px; color: var(--texte-doux); }
    .case-element { grid-row: span 3; position: relative; padding-left: 18px; }
    .case-element .grand { box-shadow: 0 0 0 4px color-mix(in srgb, var(--cat) 30%, transparent), 0 6px 16px rgba(0,0,0,.15); }
    .case-element .lib { position: absolute; left: 0; font-size: 12px; font-weight: 800; color: var(--cat); }
    .case-element .lib-a { top: 10px; color: #0f766e; } .case-element .lib-z { top: 32px; color: #a21caf; }
    .legende-case { margin: 8px 0 0; }
    .a-trouver { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--bord); }
    .a-trouver h3 { margin: 0 0 8px; font-size: 15px; }
    .a-trouver .sous-titre { margin: 10px 0 6px; font-size: 13px; font-weight: 600; color: var(--texte-doux); }
    .qs { display: grid; gap: 6px; }
    .qs.couches { grid-template-columns: 1fr 1fr; column-gap: 14px; }
    .qs.couches .q { grid-template-columns: auto 50px 16px; white-space: nowrap; font-size: 12.5px; }
    .qs.couches .q input { width: 50px; }
    .q { display: grid; grid-template-columns: 1fr 64px 18px; align-items: center; gap: 6px; font-size: 13px; }
    .q input { width: 64px; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); font: inherit; text-align: center; }
    .q input.juste { border-color: #16a34a; background: color-mix(in srgb, #16a34a 12%, var(--surface)); }
    .q input.faux { border-color: #dc2626; background: color-mix(in srgb, #dc2626 12%, var(--surface)); }
    .q .res { font-size: 14px; }
    .ligne-btn { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .details { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin-top: 10px; }
    .details dt { color: var(--texte-doux); }
    .details dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .config { font-family: "Cambria Math", Cambria, serif; font-size: 15px; font-weight: 500 !important; line-height: 1.6; }

    #formule { font-size: 17px; font-family: "Cambria Math", Cambria, serif; }
    .calcul { margin: 2px 0; font-family: "Cambria Math", Cambria, serif; font-size: 15px; }
    .resultat-m { font-size: 24px; font-weight: 750; color: var(--accent); font-variant-numeric: tabular-nums; }
    table.detail { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    table.detail th { text-align: left; color: var(--texte-doux); font-weight: 600; padding: 4px 4px; border-bottom: 1px solid var(--bord); }
    table.detail td { padding: 4px 4px; border-bottom: 1px solid var(--bord); }
    table.detail td:not(:first-child), table.detail th:not(:first-child) { text-align: right; }
    .barre-pct { height: 6px; border-radius: 3px; background: var(--c4); margin-top: 3px; }
    .exemples { display: flex; flex-wrap: wrap; gap: 5px; }
  </style>
</head>
<body>
  <div class="outil">
    <aside class="panneau">
      <div>
        <h1>Tableau périodique</h1>
        <p class="note">Clique sur un élément : sa case s'affiche en grand. À toi de retrouver le nombre de protons, de neutrons et d'électrons, puis vérifie. La légende repère les familles ; ★ marque les éléments à connaître.</p>
      </div>
      <section class="groupe" id="zone-fiche"></section>

      <section class="groupe">
        <h2>Masse molaire</h2>
        <div class="champ">
          <label for="formule">Formule brute</label>
          <input type="text" id="formule" value="H2O" spellcheck="false" placeholder="ex. H2O, CO2, Ca(OH)2">
        </div>
        <div class="exemples" id="exemples">
          <button class="btn petit">H2O</button><button class="btn petit">CO2</button><button class="btn petit">NaCl</button>
          <button class="btn petit">O2</button><button class="btn petit">CH4</button><button class="btn petit">C6H12O6</button>
        </div>
        <div id="resultat"></div>
        <div class="champ">
          <label for="masse">Masse de l'échantillon m (g)</label>
          <input type="number" id="masse" value="10" min="0" step="any">
        </div>
        <div class="stat"><div class="nom">Quantité de matière n = m / M</div><div class="val" id="n-mol">—</div></div>
      </section>
    </aside>

    <main class="scene">
      <div class="conteneur"><div class="tableau" id="tableau"></div></div>
      <div class="legende" id="legende"></div>
    </main>
  </div>
  <script src="elements.js"></script>
  <script src="tableau.js"></script>
</body>
</html>
